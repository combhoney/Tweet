name: X Viral Video Automation (USA Target)

on:
  repository_dispatch:
    types: [x_breaking_news, x_daily_top10]
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Select Mode: breaking (2-Hour News) or daily_top10 (24-Hour Mega Video)'
        required: false
        default: 'breaking'

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 🌟 Kokoro TTS এর জন্য espeak-ng এবং ভিডিওর জন্য FFmpeg
      - name: Install System Dependencies (FFmpeg, Fonts, Rclone, espeak-ng)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation ffmpeg rclone espeak-ng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Rclone
        shell: python
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          import os
          conf_data = os.environ.get('RCLONE_CONF_DATA', '').strip()
          if conf_data:
              config_path = os.path.expanduser('~/.config/rclone/rclone.conf')
              os.makedirs(os.path.dirname(config_path), exist_ok=True)
              with open(config_path, 'w', encoding='utf-8') as f:
                  f.write(conf_data)
              print("✅ Rclone configured successfully!")

      - name: Run Viral Video Pipeline
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GROQ_API: ${{ secrets.GROQ_API }}
          Ollama_API_Key: ${{ secrets.Ollama_API_Key }}
          MICROLINK_API_KEYS: ${{ secrets.MICROLINK_API_KEYS }}
          # 🌟 Kokoro বা Edge নির্বাচন (Secrets এ 'kokoro' বা 'edge' লিখবেন)
          TTS_ENGINE: ${{ secrets.TTS_ENGINE || 'kokoro' }}
          UPLOAD_TO_YOUTUBE: ${{ secrets.UPLOAD_TO_YOUTUBE || 'true' }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          RUN_MODE: ${{ github.event.action == 'x_daily_top10' && 'daily_top10' || github.event.inputs.run_mode || 'breaking' }}
        run: python main.py

      - name: Commit and Push History & API State
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add workspace/ || true
          git commit -m "Update processed tweet history and key pointers [skip ci]" || echo "No changes to commit"
          git push || true
