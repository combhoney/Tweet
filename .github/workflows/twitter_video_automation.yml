name: X 24/7 Category News Network

on:
  repository_dispatch:
    # 🌟 cron-job.org থেকে যেকোনো ইভেন্ট নাম আসলেই সাথে সাথে রান হবে
    types: [x_video_run, x_viral_video_run, x_breaking_news, x_daily_top10]
  workflow_dispatch:
    inputs:
      category:
        description: 'Choose category (auto_rotate, tech, political, nba, nfl, soccer, golf, mlb, tennis, ncaaf, nhl, fantasy_sports, combat_sports, f1, space)'
        required: false
        default: 'auto_rotate'

# 🌟 কনকারেন্সি লক: আগের রান শেষ না হওয়া পর্যন্ত পরবর্তী রান নিরাপদে লাইনে অপেক্ষা করবে
concurrency:
  group: x-video-pipeline-lock
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 🌟 FFmpeg, Fonts, Rclone এবং Kokoro TTS এর জন্য espeak-ng ইনস্টল
      - name: Install System Dependencies (FFmpeg, Fonts, Rclone, espeak-ng)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation ffmpeg rclone espeak-ng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🌟 Google Drive এর জন্য Rclone কনফিগারেশন
      - name: Configure Rclone
        shell: python
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          import os
          conf_data = os.environ.get('RCLONE_CONF_DATA', '').strip()
          if conf_data:
              config_path = os.path.expanduser('~/.config/rclone/rclone.conf')
              os.makedirs(os.path.dirname(config_path), exist_ok=True)
              with open(config_path, 'w', encoding='utf-8') as f:
                  f.write(conf_data)
              print("✅ Rclone configured successfully!")

      # 🌟 মূল শর্টস ভিডিও পাইপলাইন রান
      - name: Run Category Shorts Compilation Pipeline
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GROQ_API: ${{ secrets.GROQ_API }}
          Ollama_API_Key: ${{ secrets.Ollama_API_Key }}
          MICROLINK_API_KEYS: ${{ secrets.MICROLINK_API_KEYS }}
          TTS_ENGINE: ${{ secrets.TTS_ENGINE || 'kokoro' }}
          UPLOAD_TO_YOUTUBE: ${{ secrets.UPLOAD_TO_YOUTUBE || 'true' }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          CATEGORY: ${{ github.event.inputs.category != 'auto_rotate' && github.event.inputs.category || '' }}
        run: python main.py

      # 🌟 অটো-ক্লিনআপ ও হিস্ট্রি সেভ: পুরোনো সব সাময়িক ফোল্ডার মুছে ফেলবে এবং শুধু হিস্ট্রি ও স্টেট রাখবে
      - name: Commit and Push History & Category State (Auto-Cleanup)
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # গিটহাব থেকে পুরোনো সমস্ত ছবির ফোল্ডার পার্মানেন্টলি ডিলিট করা
          git rm -r --cached workspace/shorts_* workspace/tweet_* 2>/dev/null || true
          rm -rf workspace/shorts_* workspace/tweet_* 2>/dev/null || true
          
          # শুধুমাত্র দরকারি হিস্ট্রি ও স্টেট ফাইল গিটহাবে সেভ করা
          git add -f workspace/history.txt workspace/category_state.json workspace/api_key_state.json 2>/dev/null || true
          
          git commit -m "Auto-clean temporary workspace folders and update history [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || true
